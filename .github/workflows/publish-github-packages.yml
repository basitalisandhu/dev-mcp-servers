name: publish-github-packages

# Publishes every server to GitHub Packages when a version tag is pushed, using only GITHUB_TOKEN:
#   npm:        @basitalisandhu/mcp-<server> to https://npm.pkg.github.com
#   containers: ghcr.io/basitalisandhu/mcp-<server>:<version> and :latest (linux/amd64, linux/arm64),
#               each with an SPDX SBOM, a build provenance attestation and a keyless cosign signature
#   MCP registry: io.github.basitalisandhu/mcp-<server> on registry.modelcontextprotocol.io, as an OCI package
#               pointing at the GHCR image (GitHub OIDC login, no secret; tags only)
# then creates the GitHub Release for the tag with generated notes and the SBOMs attached.
#
# Pull requests that touch the packaging run the same build as a dry run (nothing is pushed).
# workflow_dispatch on a tag publishes like a tag push; on a branch it is a dry run unless "publish" is ticked.
# Versions that already exist on the registry are skipped, so re-running a release is safe.

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/publish-github-packages.yml"
      - "packages/*/package.json"
      - "packages/*/server.json"
      - "scripts/check-server-json.mjs"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish from a branch (a tag ref always publishes)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-github-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/basitalisandhu/mcp-
  PUBLISH: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      servers: ${{ steps.meta.outputs.servers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:server-json
      - name: Version and server list (every version must match the tag)
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          for f in packages/*/package.json packages/*/server.json; do
            V=$(node -p "require('./$f').version")
            if [ "$V" != "$VERSION" ]; then echo "::error file=$f::version $V does not match $VERSION"; exit 1; fi
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "servers=$(ls packages | node -e 'console.log(JSON.stringify(require("fs").readFileSync(0,"utf8").trim().split("\n")))')" >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish npm packages to GitHub Packages
    needs: build-test
    if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@basitalisandhu"
      - run: npm ci
      - run: npm run build
      - name: Publish each workspace, skipping versions that already exist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for dir in packages/*/; do
            NAME=$(node -p "require('./${dir}package.json').name")
            VERSION=$(node -p "require('./${dir}package.json').version")
            if npm view "$NAME@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "$NAME@$VERSION already exists, skipping"
              continue
            fi
            if ! OUT=$(npm publish --workspace "$dir" 2>&1); then
              echo "$OUT"
              if echo "$OUT" | grep -qiE "E409|EPUBLISHCONFLICT|cannot publish over"; then
                echo "$NAME@$VERSION already exists, skipping"
                continue
              fi
              exit 1
            fi
            echo "Published $NAME@$VERSION"
          done

  publish-containers:
    name: Image mcp-${{ matrix.server }}
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.build-test.outputs.servers) }}
    env:
      IMAGE: ghcr.io/basitalisandhu/mcp-${{ matrix.server }}
      VERSION: ${{ needs.build-test.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image description from package.json
        id: desc
        run: echo "text=$(node -p "require('./packages/${{ matrix.server }}/package.json').description")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          build-args: |
            SERVER=${{ matrix.server }}
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=mcp-${{ matrix.server }}
            org.opencontainers.image.description=${{ steps.desc.outputs.text }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.modelcontextprotocol.server.name=io.github.basitalisandhu/mcp-${{ matrix.server }}
          # The MCP registry checks ownership by reading the io.modelcontextprotocol.server.name label from the
          # image config (Dockerfile LABEL and labels above); the annotations repeat it on the index and manifests.
          annotations: |
            index:org.opencontainers.image.description=${{ steps.desc.outputs.text }}
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=MIT
            index:io.modelcontextprotocol.server.name=io.github.basitalisandhu/mcp-${{ matrix.server }}
            manifest:io.modelcontextprotocol.server.name=io.github.basitalisandhu/mcp-${{ matrix.server }}
          # Provenance comes from attest-build-provenance below; keep the image index free of extra manifests.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.server }}
          cache-to: type=gha,mode=max,scope=${{ matrix.server }}
      - name: SBOM (SPDX)
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-mcp-${{ matrix.server }}-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM artifact
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-mcp-${{ matrix.server }}
          path: sbom-mcp-${{ matrix.server }}-${{ env.VERSION }}.spdx.json
          if-no-files-found: error
      - name: Build provenance attestation
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
      - name: Sign the image (keyless)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  publish-mcp-registry:
    name: Publish to the MCP registry
    # Runs after every image is pushed: the registry pulls each image anonymously and reads its
    # io.modelcontextprotocol.server.name label. On pull requests it only validates the server.json files.
    needs: [build-test, publish-containers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build-test.outputs.version }}
      MCP_PUBLISHER_VERSION: "1.8.1"
      # sha256 of mcp-publisher_linux_amd64.tar.gz from registry_1.8.1_checksums.txt of that release
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      REGISTRY_URL: https://registry.modelcontextprotocol.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help | head -1
      - name: Set the version from the tag in every server.json
        run: |
          for f in packages/*/server.json; do
            jq --arg v "$VERSION" '.version = $v | .packages |= map(if .registryType == "oci" then .identifier = (.identifier | sub(":[^:/]+$"; "")) + ":" + $v else . end)' \
              "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
      - name: Validate every server.json against the registry
        run: |
          for f in packages/*/server.json; do
            echo "== $f"
            ./mcp-publisher validate "$f"
          done
      - name: Log in with GitHub OIDC
        if: github.ref_type == 'tag'
        run: ./mcp-publisher login github-oidc
      - name: Publish each server, skipping versions already in the registry
        if: github.ref_type == 'tag'
        run: |
          failed=0
          for f in packages/*/server.json; do
            NAME=$(jq -r .name "$f")
            ENCODED=$(jq -rn --arg n "$NAME" '$n | @uri')
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' "$REGISTRY_URL/v0.1/servers/$ENCODED/versions/$VERSION" || true)
            if [ "$CODE" = "200" ]; then
              echo "$NAME@$VERSION is already in the registry, skipping"
              continue
            fi
            if OUT=$(./mcp-publisher publish "$f" 2>&1); then
              echo "$OUT"
              echo "Published $NAME@$VERSION"
            elif echo "$OUT" | grep -qiE "duplicate version|already exists"; then
              echo "$OUT"
              echo "$NAME@$VERSION is already in the registry, skipping"
            else
              echo "$OUT"
              echo "::error file=$f::publishing $NAME@$VERSION failed"
              failed=1
            fi
          done
          exit "$failed"

  release:
    name: GitHub Release
    needs: [build-test, publish-npm, publish-containers]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-mcp-*
          path: sboms
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l sboms
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" sboms/*.spdx.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" sboms/*.spdx.json --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
          fi
